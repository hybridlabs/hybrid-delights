# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.

# Project
version=1.2.1
group=dev.hybridlabs
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Hybrid Delights
mod_author=Hybrid Labs
mod_id=hybrid_delights
license=MIT

credits=MysticKoko, Aqua, Andante, Eggo, Ragno, murphy slaw

description=A mod that integrates between HybridLabs' mods and various cooking mods

minecraft_version_range=[1.20.1, 1.22)

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03
kotlin_version=2.1.20

# Local mods
# Built from their checkout, here the hybrid-aquatic submodule, in place of its published jar.
# The checkout is required: `git submodule update --init` gets it.
local_mods=hybrid-aquatic

# Common deps
aquatic_version=1.7.5
hapi_version=1.1.3
geckolib_version=1.20.1:4.8.2
lithostitched_version=1.4.11
biolith_version=1.0.1-alpha.1
curios_version=5.9.1+1.20.1
trinkets_version=3.7.1
farmersdelight_version=1.20.1-1.3.2

# Fabric
fabric_version=0.92.7+1.20.1
fabric_loader_version=0.18.4

# Forge
forge_version=47.4.10
kotlin_for_forge_version=4.11.0
forge_loader_version_range=[47,)

# Publishing
modrinth_id=WR49BBCu
curseforge_id=1259032

# Gradle
# Daemon reuse, parallel execution and the local build cache are the three settings that dominate
# incremental build time on a multi-subproject mod. jvmargs is sized for the Minecraft
# decompile/remap steps, which are the memory-hungry part of the build.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Toolchains are provisioned by the foojay resolver declared in settings.gradle, so the build no
# longer depends on the developer's JAVA_HOME matching java_version.
org.gradle.java.installations.auto-download=true
