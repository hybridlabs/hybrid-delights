# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.

# Project
version=1.3.0
group=dev.hybridlabs
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Hybrid Delights
mod_author=Hybrid Labs
mod_id=hybrid_delights
license=MIT

credits=MysticKoko, Aqua, Andante, Eggo, Ragno, murphy slaw

description=A mod that integrates between HybridLabs' mods and Farmer's Delight

minecraft_version_range=[1.21.1, 1.22)

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17
kotlin_version=2.2.0

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# Fabric
loom_version=1.17.20
fabric_version=0.116.11+1.21.1
fabric_loader_version=0.19.3
fabric_kotlin_version=1.13.4

fdrf_version=1.21.1-3.3.3+refabricated

# NeoForge
neoforge_version=21.1.219
neoforge_loader_version_range=[4,)
kotlin_for_forge_version=5.10.0
farmersdelight_version=1.21.1-1.3.2

# Forge
forge_version=47.4.10
forge_loader_version_range=[47,)

# Build tooling (versions are resolved in settings.gradle pluginManagement)
moddev_version=2.0.147
foojay_version=1.0.0
mod_publish_version=2.2.0

# Gradle
# Daemon reuse, parallel execution and the local build cache are the three settings that dominate
# incremental build time on a multi-subproject mod. jvmargs is sized for the Minecraft
# decompile/remap steps, which are the memory-hungry part of the build.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Toolchains are provisioned by the foojay resolver declared in settings.gradle, so the build no
# longer depends on the developer's JAVA_HOME matching java_version.
org.gradle.java.installations.auto-download=true
