import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
	id "org.jetbrains.kotlin.jvm"
	id "maven-publish"
}

version = mod_version
group = maven_group

base {
	archivesName = mod_id
}

repositories {
	maven {
		name = "Modrinth"
		url  = "https://api.modrinth.com/maven"
	}

	maven {
		name = "Greenhouse Maven"
		url = 'https://repo.greenhouse.house/releases/'
	}

	maven {
		name = "devOS"
		url  = "https://mvn.devos.one/releases/"
	}

	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes (Required by Porting Lib)
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}

	maven {
		name = "Jitpack"
		url  = "https://jitpack.io/"
	}

	maven {
		name = "GeckoLib"
		url  = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:$minecraft_version"
	mappings "net.fabricmc:yarn:$minecraft_version+build.$yarn_build:v2"

	modImplementation "net.fabricmc:fabric-loader:$loader_version"

	modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"
	modImplementation "net.fabricmc:fabric-language-kotlin:$fabric_kotlin_version+kotlin.$kotlin_version"

	modImplementation "maven.modrinth:hybrid-aquatic:$aquatic_version"
	modImplementation "software.bernie.geckolib:geckolib-fabric-$minecraft_version:$geckolib_version"

	modImplementation("vectorwing:FarmersDelight:$farmers_delight_version+refabricated") {
		exclude(group: "net.fabricmc")
	}
}

fabricApi {
	configureDataGeneration {
		setModId("$mod_id")
		outputDirectory = file("src/generated/resources")
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		mod_id {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = 17
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}