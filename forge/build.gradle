plugins {
    id 'dev.hybridlabs.forge'
    id 'org.jetbrains.kotlin.jvm'
}

processResources {
    // Recipes for optional integrations carry Fabric's load conditions, which Forge ignores.
    // Translate them, or every such recipe fails to parse when the integrated mod is absent.
    doLast {
        fileTree(destinationDir).matching { include 'data/**/*.json' }.each { file ->
            if (!file.text.contains('"fabric:load_conditions"')) return

            def json = new groovy.json.JsonSlurper().parse(file)
            def conditions = json.remove('fabric:load_conditions')
            if (conditions == null) return

            json['conditions'] = conditions.collect { condition ->
                def modLoaded = condition['values'].collect { [type: 'forge:mod_loaded', modid: it] }
                switch (condition['condition']) {
                    case 'fabric:all_mods_loaded': return modLoaded
                    case 'fabric:any_mods_loaded': return [[type: 'forge:or', values: modLoaded]]
                    default: throw new GradleException("${file}: no Forge equivalent for ${condition['condition']}")
                }
            }.flatten()
            file.text = groovy.json.JsonOutput.toJson(json)
        }
    }
}

// Mods Hybrid Delights integrates with, so the integrations can be tested in a dev run. Their own
// configuration, so they are absent from the compile classpath and from the published POM.
configurations {
    integrationMods {
        canBeConsumed = false
        transitive = false
    }
}

// FML only registers a jar as a mod once it finds it in the run's 'mods' folder, so the jars are
// copied there instead of going on the runtime classpath. Sync clears anything else in it.
def copyIntegrationMods = tasks.register('copyIntegrationMods', Sync) {
    from configurations.integrationMods
    into layout.projectDirectory.dir('run/mods')
}

dependencies {
    modImplementation("dev.hybridlabs.hapi:hapi-forge-1.20.1:1.1.0")

    modImplementation("maven.modrinth:farmers-delight:${farmersdelight_version}")

    modRuntimeOnly  "software.bernie.geckolib:geckolib-forge-$geckolib_version"

    // Their hard dependencies. NeoForge refuses to start a run without these. Geckolib is left
    // out on purpose: it already arrives as a mod, and a second copy breaks module resolution.
    integrationMods "maven.modrinth:curios:${curios_version}"
    integrationMods "maven.modrinth:lithostitched:${lithostitched_version}"
    integrationMods "maven.modrinth:biolith:${biolith_version}"
}

publishMods.platforms.configureEach {
    requires 'kotlin-for-forge', 'farmers-delight', 'hybrid-api'
    optional 'lets-do-farm-charm', 'hybrid-aquatic', 'hybrid-birds', 'hybrid-blocks', 'fantastic-fishery'
}
