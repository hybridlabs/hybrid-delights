plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'org.jetbrains.kotlin.jvm'
}

// This config will copy the output of Fabric's runDatagen task into
// 'src/generated/resources/fabric' when the Forge runData task is run.
configurations.create('fabricDatagen')
dependencies {
    fabricDatagen project(path: ':fabric', configuration: 'datagenOutput')
}

legacyForge {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'kotlin'
    version = "${minecraft_version}-${forge_version}"

    // AT validation is broken on Forge 1.20.1
    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')]

    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    sourceSets {
        main.kotlin.srcDirs = ['src/main/java', 'src/main/kotlin']
    }

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('../common/src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file("../fabric/src/generated/resources").getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }

    mavenCentral()
    mavenLocal()
}

sourceSets.main.resources.srcDirs += 'src/generated/resources'

processResources {
    from configurations.fabricDatagen.singleFile
}

// Mods Hybrid Delights integrates with, so the integrations can be tested in a dev run. Their own
// configuration, so they are absent from the compile classpath and from the published POM.
configurations {
    integrationMods {
        canBeConsumed = false
        transitive = false
    }
}

// FML only registers a jar as a mod once it finds it in the run's 'mods' folder, so the jars are
// copied there instead of going on the runtime classpath. Sync clears anything else in it.
def copyIntegrationMods = tasks.register('copyIntegrationMods', Sync) {
    from configurations.integrationMods
    into layout.projectDirectory.dir('run/mods')
}

dependencies {
    compileOnly project(":common")

    modImplementation("dev.hybridlabs.hapi:hapi-forge-1.20.1:1.0.0")

    modImplementation("maven.modrinth:farmers-delight:${farmersdelight_version}")

    implementation 'org.jetbrains:annotations:25.0.0'
    implementation 'thedarkcolour:kotlinforforge:4.11.0'
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    modRuntimeOnly  "software.bernie.geckolib:geckolib-forge-$geckolib_version"

    // Their hard dependencies. NeoForge refuses to start a run without these. Geckolib is left
    // out on purpose: it already arrives as a mod, and a second copy breaks module resolution.
    integrationMods "maven.modrinth:curios:${curios_version}"
    integrationMods "maven.modrinth:lithostitched:${lithostitched_version}"
    integrationMods "maven.modrinth:biolith:${biolith_version}"
}

compileKotlin {
    source(project(":common").sourceSets.main.allSource)
    inputs.file "../gradle.properties"
}