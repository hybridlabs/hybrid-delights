plugins {
    id 'dev.hybridlabs.forge'
    id 'org.jetbrains.kotlin.jvm'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.forge.mixins.json")
}

// This config will copy the output of Fabric's runDatagen task into
// the Forge jar, since datagen only runs on Fabric.
configurations.create('fabricDatagen')
dependencies {
    fabricDatagen project(path: ':fabric', configuration: 'datagenOutput')
}

sourceSets.main.resources.srcDirs += 'src/generated/resources'

processResources {
    from configurations.fabricDatagen.singleFile
}

dependencies {
    modImplementation("dev.hybridlabs.hapi:hapi-forge-${minecraft_version}:${hapi_version}")

    // Built from the hybrid-aquatic checkout listed in local_mods, rather than its published jar.
    modImplementation("dev.hybridlabs:hybrid_aquatic-forge-${minecraft_version}:${aquatic_version}") {
        transitive = false
    }

    modRuntimeOnly "software.bernie.geckolib:geckolib-forge-$geckolib_version"
    modImplementation "maven.modrinth:lithostitched:${lithostitched_version}-forge-1.20"
    modImplementation("com.terraformersmc:biolith-forge:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    modImplementation("maven.modrinth:farmers-delight:${farmersdelight_version}")

    implementation 'org.jetbrains:annotations:25.0.0'
}

publishMods.platforms.configureEach {
    requires 'kotlin-for-forge', 'farmers-delight', 'hybrid-aquatic'
    optional 'lets-do-farm-charm'
}
