plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    sourceSets {
        main.kotlin.srcDirs = ['src/main/java', 'src/main/kotlin']
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', 'hybrid_delights', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file("../fabric/src/generated/resources").getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }

    mavenCentral()
    mavenLocal()
}
sourceSets.main.resources.srcDirs += 'src/generated/resources'

configurations.create('fabricDatagen')
dependencies {
    fabricDatagen project(path: ':fabric', configuration: 'datagenOutput')
}

processResources {
    from configurations.fabricDatagen.singleFile
}

// Mods Hybrid Delights integrates with, so the integrations can be tested in a dev run. Their own
// configuration, so they are absent from the compile classpath and from the published POM.
configurations {
    integrationMods {
        canBeConsumed = false
        transitive = false
    }
}

// FML only registers a jar as a mod once it finds it in the run's 'mods' folder, so the jars are
// copied there instead of going on the runtime classpath. Sync clears anything else in it.
def copyIntegrationMods = tasks.register('copyIntegrationMods', Sync) {
    from configurations.integrationMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') { dependsOn copyIntegrationMods }
tasks.named('runServer') { dependsOn copyIntegrationMods }
tasks.named('runData') { dependsOn copyIntegrationMods }

dependencies {
    compileOnly project(":common")

    implementation 'org.jetbrains:annotations:25.0.0'

    implementation("dev.hybridlabs.hapi:hapi-neoforge-1.21.1:1.0.0")

    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"
    implementation("maven.modrinth:farmers-delight:${farmersdelight_version}")

    integrationMods "maven.modrinth:hybrid-aquatic:${hybrid_aquatic_version}"

    // Their hard dependencies. NeoForge refuses to start a run without these. Geckolib is left
    // out on purpose: it already arrives as a mod, and a second copy breaks module resolution.
    integrationMods "maven.modrinth:curios:${curios_version}"
    integrationMods "maven.modrinth:lithostitched:${lithostitched_version}"
    integrationMods "maven.modrinth:biolith:${biolith_version}"
}

compileKotlin {
    source(project(":common").sourceSets.main.allSource)
    inputs.file "../gradle.properties"
}
