plugins {
    id 'dev.hybridlabs.common'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    // Aquatic moved its tool materials into HAPI, so the shared item types live here.
    implementation("dev.hybridlabs.hapi:hapi-common-${minecraft_version}:${hapi_version}")

    // Built from the hybrid-aquatic checkout listed in local_mods, rather than its published jar.
    implementation("dev.hybridlabs:hybrid_aquatic-common-${minecraft_version}:${aquatic_version}")

    modImplementation("maven.modrinth:farmers-delight:${farmersdelight_version}")

    implementation("com.terraformersmc:biolith-forge:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    modImplementation "maven.modrinth:lithostitched:${lithostitched_version}-forge-1.20"
}
