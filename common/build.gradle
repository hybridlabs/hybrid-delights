plugins {
    id 'dev.hybridlabs.common'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    // The common module compiles against the vanilla API only. Loader modules bring HAPI and
    // GeckoLib at runtime.
    compileOnly("dev.hybridlabs.hapi:hapi-common-${minecraft_version}:${hapi_version}")
    compileOnly("com.geckolib:geckolib-neoforge-${geckolib_version}")

    // Farmer's Delight's common classes (food effects, stove blocks, cabinet sounds) are
    // loader-independent; the loader modules add the runtime jar.
    compileOnly("curse.maven:farmers-delight-26-neo-ver-1699768:${fdneoforge_version}")
}

// GeckoLib 5.5 moved to the com.geckolib group, which hybrid-gradle's GeckoLib repository
// filter does not include yet.
repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('com.geckolib')
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}
