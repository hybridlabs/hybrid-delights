plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
    id "org.jetbrains.kotlin.jvm"
}

repositories {
    maven {
        url "https://maven.terraformersmc.com/releases/"
    }

    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
    }

    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }

    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    maven {
        name = "Cassian's Maven"
        url = 'https://maven.cassian.cc'
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven/"
    }

    maven {
        name = "Debug Utils (GitLab)"
        url = "https://gitlab.com/api/v4/projects/21830712/packages/maven/"
    }

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }

    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    implementation project(":common")
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:$fabric_kotlin_version+kotlin.$kotlin_version"
    modImplementation("maven.modrinth:hybrid-aquatic:qzgZEGoR") {
        transitive = false
    }
    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modRuntimeOnly "maven.modrinth:lithostitched:${lithostitched_version}-fabric-1.21.1"
    modRuntimeOnly("com.terraformersmc:biolith-fabric:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    modRuntimeOnly "dev.emi:trinkets:${trinkets_version}"

    implementation("dev.hybridlabs.hapi:hapi-common-1.21.1:1.0.0")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.1:1.0.0")
    implementation 'org.jetbrains:annotations:25.0.0'

    //We still have to load the loader-specific version of any mods included in common

    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    modImplementation "maven.modrinth:carpet:$carpet_version"
    modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }
}

// Set up datagen and export the output to be consumed by other projects
configurations {
    datagenOutput
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
    }

    dependencies {
        datagenOutput files(runDatagen)
    }
}

loom {

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    compileKotlin {
        source(project(":common").sourceSets.main.allSource)
        inputs.file "../gradle.properties"
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}