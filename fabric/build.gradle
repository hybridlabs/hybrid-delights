plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-${minecraft_version}:${hapi_version}")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-${minecraft_version}:${hapi_version}")

    modImplementation "software.bernie.geckolib:geckolib-fabric-${geckolib_version}"

    // Built from the hybrid-birds checkout listed in local_mods, rather than its published jar.
    modLocalRuntime("dev.hybridlabs:hybrid_birds-fabric-${minecraft_version}:${hybrid_birds_version}")
    modImplementation("maven.modrinth:farmers-delight-refabricated:${fdrf_version}")
}

configurations {
    datagenOutput
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
    }

    dependencies {
        datagenOutput files(runDatagen)
    }
}

// runDatagen writes into src/generated/resources, which is part of the main sourceset.
// Without this ordering Gradle rejects a combined 'build runDatagen' invocation with an
// implicit-dependency validation error and datagen never gets a chance to run.
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') mustRunAfter tasks.named('runDatagen')
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'farmers-delight-refabricated', 'hybrid-api'
    optional 'farm_and_charm', 'hybrid-aquatic', 'hybrid-birds'
}
